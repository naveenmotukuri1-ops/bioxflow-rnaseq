title: "bioxflow/rnaseq"
subtitle: "Dual-evidence RNA-seq quantification and differential expression"
intro_text: >
  This report was generated by the <a href="https://www.bioxflow.uk">Bioxflow</a> RNA-seq pipeline.
  Every sample is quantified twice, by Salmon and by STAR, and the two results are compared.

report_comment: >
  Samples marked REVIEW in the concordance table should be inspected before interpreting
  differential expression results.

run_modules:
  - custom_content
  - fastqc
  - fastp
  - salmon
  - star
  - samtools

custom_content:
  order:
    - bioxflow_concordance
    - bioxflow_concordance_scatter
    - bioxflow_strandedness
    - bioxflow_pca
    - bioxflow_sample_distances
    - bioxflow_de_summary

use_filename_as_sample_name:
  - fastp

extra_fn_clean_exts:
  - ".fastp"
  - ".flagstat"
  - ".ReadsPerGene.out.tab"

show_analysis_paths: false
disable_version_detection: true
